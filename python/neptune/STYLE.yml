  ### MESSAGES #############################################

  - id: "error-message-trailing-period"
    description: "Error messages must not end with a period."
    pattern: "\\braise\\b\\s+[A-Za-z_][A-Za-z0-9_]*Error\\(\\s*(?:[A-Za-z_][A-Za-z0-9_]*\\s*=\\s*)?(?:[rRuUbBfF]{0,2})?(['\"])(?:\\\\.|(?!\\1).)*?(?<!\\.)\\.\\1"
    include: [ "**/*.py" ]
    exclude: [ ]
    flags: [ ]
    severity: "warning"

  - id: "logging-message-trailing-period"
    description: "Logging messages must not end with a period."
    pattern: "\\blogging\\.(?:debug|info|warning|error|critical|exception)\\(\\s*(?:[A-Za-z_][A-Za-z0-9_]*\\s*=\\s*)?(?:[rRuUbBfF]{0,2})?(['\"])(?:\\\\.|(?!\\1).)*?(?<!\\.)\\.\\1"
    include: [ "**/*.py" ]
    exclude: [ ]
    flags: [ ]
    severity: "warning"
