## 1. PROJECT METADATA ###################################################################
[tool.poetry]
name = "nutil"
version = "1.0.1a1"
description = "NEPTUNE is a collection of decoupled Python modules for robust application development"
authors = ["Florian Barras <florian@barras.io>"]
maintainers = ["Florian Barras <florian@barras.io>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/b-io/io.barras/tree/master/python/neptune/nutil"

packages = [
    { include = "nutil", from = "source" },
]

# Include specific resource files
include = [
    "resources/common.properties"
]

[tool.poetry.urls]
"Bug Tracker" = "https://github.com/b-io/io.barras/issues"
"Documentation" = "https://repo.barras.io/io.barras.python/neptune/nutil/index.html"
"Source Code" = "https://github.com/b-io/io.barras/tree/master/python/neptune/nutil"


## 2. MAIN DEPENDENCIES ##################################################################
[tool.poetry.dependencies]
python = ">=3.10,<4.0"

### Concurrency & System ###################################
multiprocess = "^0.70.18"     # Multiprocessing alternative with enhanced features
psutil = "^7.2.0"             # System and process resource monitoring

### DataFrames & Tables ####################################
numpy = "^2.2.6"              # Array computing and linear algebra
pandas = "^2.3.3"             # Labeled data structures and analysis
tabulate = "^0.9.0"           # Pretty tables for CLI and notebooks

### File & Data I/O ########################################
chardet = "^5.2.0"            # Text encoding detection
openpyxl = "^3.1.5"           # XLSX reader and writer (Excel compatibility)
orjson = "^3.11.5"            # Fast JSON serialization and parsing
pyyaml = "^6.0.3"             # YAML encoding and decoding
xlsxwriter = "^3.2.9"         # XLSX writer with formatting control

### Testing ################################################
pytest = "^9.0.2"             # Unit testing framework

### Utilities ##############################################
annotated-types = "^0.7.0"    # Metadata for static type checkers
cffi = "^2.0.0"               # Interface for calling C code
deprecated = "^1.3.1"         # Runtime deprecation warnings
ftfy = "^6.3.1"               # Unicode text fixes (mojibake, broken accents, etc.)
importlib-metadata = "^8.7.1" # Access to package metadata
joblib = "^1.5.3"             # Disk caching and parallel execution
more-itertools = "^10.8.0"    # Utilities extending itertools
pydantic = "^2.12.5"          # Data validation and configuration parsing
pydantic-core = "^2.41.5"     # Core runtime for Pydantic
pydantic-settings = "^2.12.0" # Environment-based settings management
python-dateutil = "^2.9.0"    # Date and time parsing and manipulation
python-dotenv = "^1.2.1"      # Loading of .env configuration files
validators = "^0.35.0"        # Lightweight data and URL checks


## 3. OTHER DEPENDENCIES #################################################################

[tool.poetry.group.docs.dependencies]
### Documentation ##########################################
docutils = ">=0.20,<0.22"         # reStructuredText parsing and rendering
myst-parser = "^4.0.1"            # Markdown parser for Sphinx
sphinx = "^8.1.3"                 # Static documentation generation

[tool.poetry.group.lint.dependencies]
### Code Quality ###########################################
autoflake = "^2.3.1"              # Removal of unused imports and variables
black = "^25.12.0"                # Automatic code formatting
flake8 = "^7.3.0"                 # Style and quality checks
flake8-bugbear = "^25.11.29"      # Detection of likely bugs and design issues
flake8-comprehensions = "^3.17.0" # Comprehension style simplification
flake8-simplify = "^0.22.0"       # Simplification of overly complex constructs
isort = "^7.0.0"                  # Import sorting and grouping
mypy = "^1.19.1"                  # Static type checking

[tool.poetry.group.test.dependencies]
### Testing ################################################
coverage = "^7.13.0"              # Code coverage reporting


## 4. PACKAGE SOURCES ####################################################################

# You can configure additional or internal package sources below.
# Uncomment and customize if your company uses a private PyPI repository or proxy.

# [[tool.poetry.source]]
# name = "company"                        # A short, unique name for your repository
# url = "https://pypi.company.com/simple" # The base URL to your internal PyPI-compatible index
# priority = "primary"                    # Valid options: 'primary', 'supplemental', 'explicit'


## 5. BUILD SYSTEM #######################################################################

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"


## 6. TOOL-SPECIFIC CONFIGURATION ########################################################

### Code Quality ###########################################
[tool.black]
line-length = 100
target-version = ["py39"]

[tool.flake8]
extend-ignore = ["E203", "W503"]
max-line-length = 100

[tool.isort]
known_first_party = ["nutil"]
line_length = 100
profile = "black"
src_paths = ["source"]

[tool.mypy]
python_version = "3.9"
strict = true

check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_ignores = true


### Testing ################################################
[tool.pytest.ini_options]
addopts = "--strict-markers"
filterwarnings = [
    "error",
]
markers = [
    "integration_test: identifies tests that are part of the integration testing.",
]
testpaths = ["test"]

[tool.coverage.report]
omit = [
    "test/*", # Test file exclusion from coverage reporting
]

[tool.coverage.run]
branch = true
source = ["nutil"]
