## 1. PROJECT METADATA ###################################################################
[tool.poetry]
name = "neptune"
version = "1.0.1a1"
description = "NEPTUNE is a collection of decoupled Python modules for robust application development"
authors = ["Florian Barras <florian@barras.io>"]
maintainers = ["Florian Barras <florian@barras.io>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/b-io/io.barras/tree/master/python/neptune"

# Define multiple packages located under different 'source' folders
packages = [
    { include = "nconnect", from = "nconnect/source" },
    { include = "nfin", from = "nfin/source" },
    { include = "nformat", from = "nformat/source" },
    { include = "ngui", from = "ngui/source" },
    { include = "nlearn", from = "nlearn/source" },
    { include = "nmath", from = "nmath/source" },
    { include = "nserve", from = "nserve/source" },
    { include = "ntest", from = "ntest/source" },
    { include = "nutil", from = "nutil/source" },
]


## 2. MAIN DEPENDENCIES ##################################################################
[tool.poetry.dependencies]
python = ">=3.10,<4.0"

### Computer Vision ########################################
opencv-python = "^4.12.0.88"  # OpenCV (cv2) for image and video processing

### Concurrency & System ###################################
multiprocess = "^0.70.18"     # Multiprocessing alternative with enhanced features
psutil = "^7.1.3"             # System and process resource monitoring

### Databases ##############################################
sqlalchemy = "^2.0.45"        # SQL abstraction and object-relational mapping

### DataFrames & Tables ####################################
numpy = "^2.2.6"              # Array computing and linear algebra
pandas = "^2.3.3"             # Labeled data structures and analysis
polars = "^1.36.1"            # Arrow-based DataFrame engine
tabulate = "^0.9.0"           # Pretty tables for CLI and notebooks

### File & Data I/O ########################################
beautifulsoup4 = "^4.14.3"    # HTML/XML parsing
chardet = "^5.2.0"            # Text encoding detection
openpyxl = "^3.1.5"           # XLSX reader and writer (Excel compatibility)
orjson = "^3.11.5"            # Fast JSON serialization and parsing
pyyaml = "^6.0.3"             # YAML encoding and decoding
xlsxwriter = "^3.2.9"         # XLSX writer with formatting control

### Machine Learning #######################################
gensim = "^4.4.0"             # Topic modelling & embeddings
scikit-learn = "^1.7.2"       # Algorithms for machine learning
scikit-lego = "^0.9.6"        # Extra estimators, transformers, and tools extending scikit-learn
tensorflow = "^2.20.0"        # Deep learning framework for building and training neural networks

### Mathematics ############################################
scipy = "^1.15.3"             # Scientific computing and numerical tools
statsmodels = "^0.14.6"       # Statistical modeling and inference

### Reporting  #############################################
xhtml2pdf = "^0.2.17"         # HTML/CSS to PDF generation (ReportLab-based)

### Utilities ##############################################
annotated-types = "^0.7.0"    # Metadata for static type checkers
cffi = "^2.0.0"               # Interface for calling C code
deprecated = "^1.3.1"         # Runtime deprecation warnings
ftfy = "^6.3.1"               # Unicode text fixes (mojibake, broken accents, etc.)
importlib-metadata = "^8.7.1" # Access to package metadata
joblib = "^1.5.3"             # Disk caching and parallel execution
more-itertools = "^10.8.0"    # Utilities extending itertools
packaging = "^25.0"           # Core utilities for Python package versions and specifiers
pydantic = "^2.12.5"          # Data validation and configuration parsing
pydantic-core = "^2.41.5"     # Core runtime for Pydantic
pydantic-settings = "^2.12.0" # Environment-based settings management
python-dateutil = "^2.9.0"    # Date and time parsing and manipulation
python-dotenv = "^1.2.1"      # Loading of .env configuration files
validators = "^0.35.0"        # Lightweight data and URL checks

### Visualization ##########################################
kaleido = "^1.2.0"            # Headless engine for Plotly static image export
matplotlib = "^3.10.8"        # 2D plotting and figures
plotly = "^6.5.0"             # Interactive charts
seaborn = "^0.13.2"           # Statistical data visualizations
tqdm = "^4.67.1"              # Terminal progress bars

### Web ASGI ###############################################
asgiref = "^3.11.0"           # ASGI reference and sync/async adapter utilities
fastapi = "^0.127.0"          # ASGI web framework built on Starlette and powered by Pydantic
uvicorn = "^0.40.0"           # ASGI server for running ASGI applications

### Web HTTP ###############################################
httpcore = "^1.0.9"           # Low-level HTTP transport for clients and servers
httpx = "^0.28.1"             # Async HTTP client with a requests-style interface
python-multipart = "^0.0.21"  # Parser for multipart/form-data requests
requests = "^2.32.5"          # Synchronous HTTP client for APIs and websites
urllib3 = "^2.6.2"            # HTTP connection pooling and retry handling


## 3. OTHER DEPENDENCIES #################################################################

[tool.poetry.group.docs.dependencies]
### Documentation ##########################################
docutils = "^0.22.4"              # reStructuredText parsing and rendering
myst-parser = "^4.0.1"            # Markdown parser for Sphinx
sphinx = "^8.3.0"                 # Static documentation generation

[tool.poetry.group.lint.dependencies]
### Code Quality ###########################################
autoflake = "^2.3.1"              # Removal of unused imports and variables
black = "^25.12.0"                # Automatic code formatting
flake8 = "^7.3.0"                 # Style and quality checks
flake8-bugbear = "^25.11.29"      # Detection of likely bugs and design issues
flake8-comprehensions = "^3.17.0" # Comprehension style simplification
flake8-simplify = "^0.22.0"       # Simplification of overly complex constructs
isort = "^7.0.0"                  # Import sorting and grouping
mypy = "^1.19.1"                  # Static type checking

[tool.poetry.group.test.dependencies]
### Testing ################################################
coverage = "^7.13.0"              # Code coverage reporting
pytest = "^9.0.2"                 # Unit testing framework


