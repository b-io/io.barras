## 5. BUILD SYSTEM #######################################################################

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"


## 6. TOOL-SPECIFIC CONFIGURATION ########################################################

### Code Quality ###########################################
[tool.black]
line-length = 100
target-version = ["py39"]

[tool.flake8]
extend-ignore = ["E203", "W503"]
max-line-length = 100

[tool.isort]
known_first_party = [
    "nconnect",
    "nfin",
    "nformat",
    "ngui",
    "nlearn",
    "nmath",
    "nserve",
    "ntest",
    "nutil",
]
line_length = 100
profile = "black"
src_paths = [
    "nconnect/source",
    "nfin/source",
    "nformat/source",
    "ngui/source",
    "nlearn/source",
    "nmath/source",
    "nserve/source",
    "ntest/source",
    "nutil/source",
]

[tool.mypy]
python_version = "3.9"
strict = true

check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_ignores = true


### Testing ################################################
[tool.pytest.ini_options]
addopts = "--strict-markers"
filterwarnings = [
    "error",
]
markers = [
    "integration_test: identifies tests that are part of the integration testing.",
]
testpaths = ["test"]

[tool.coverage.report]
omit = [
    "test/*", # Test file exclusion from coverage reporting
]

[tool.coverage.run]
branch = true
source = [
    "nconnect",
    "nfin",
    "nformat",
    "ngui",
    "nlearn",
    "nmath",
    "nserve",
    "ntest",
    "nutil"
]
