## 1. PROJECT METADATA ###################################################################
[tool.poetry]
name = "nmath"
version = "1.0.1a1"
description = "Mathematical utility library for Python"
keywords = ["neptune", "mathematics", "utilities", "statistics"]
authors = ["Florian Barras <florian@barras.io>"]
maintainers = ["Florian Barras <florian@barras.io>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/b-io/io.barras/tree/master/python/neptune/nmath"

packages = [
    { include = "nmath", from = "source" },
]

# Include specific resource files
include = [
    "resources/common.properties"
]

[tool.poetry.urls]
"Bug Tracker" = "https://github.com/b-io/io.barras/issues"
"Documentation" = "https://repo.barras.io/io.barras.python/neptune/nmath/index.html"
"Source Code" = "https://github.com/b-io/io.barras/tree/master/python/neptune/nmath"


## 2. MAIN DEPENDENCIES ##################################################################
[tool.poetry.dependencies]
python = ">=3.10,<4.0"

### Mathematics ############################################
scipy = "^1.15.3"             # Scientific computing and numerical tools

### Neptune Utilities ######################################
ngui = { path = "../ngui", develop = true }                 # Neptune graphical utility library
nutil = { path = "../nutil", develop = true }               # Neptune utility library


## 3. OTHER DEPENDENCIES #################################################################

[tool.poetry.group.docs.dependencies]
### Documentation ##########################################
docutils = ">=0.21,<0.22"         # reStructuredText parsing and rendering
markdown-it-py = ">=3.0,<4.0"     # Markdown engine used by myst-parser (pinned for compatibility)
myst-parser = "^4.0.1"            # Markdown parser for Sphinx
sphinx = "^8.1.3"                 # Static documentation generation

[tool.poetry.group.lint.dependencies]
### Code Quality ###########################################
autoflake = "^2.3.1"              # Removal of unused imports and variables
black = "^25.12.0"                # Automatic code formatting
flake8 = "^7.3.0"                 # Style and quality checks
flake8-bugbear = "^25.11.29"      # Detection of likely bugs and design issues
flake8-comprehensions = "^3.17.0" # Comprehension style simplification
flake8-simplify = "^0.30.0"       # Simplification of overly complex constructs
isort = "^7.0.0"                  # Import sorting and grouping
mypy = "^1.19.1"                  # Static type checking

[tool.poetry.group.test.dependencies]
### Testing ################################################
coverage = "^7.13.1"              # Code coverage reporting


## 4. PACKAGE SOURCES ####################################################################

# You can configure additional or internal package sources below.
# Uncomment and customize if your company uses a private PyPI repository or proxy.

# [[tool.poetry.source]]
# name = "company"                        # A short, unique name for your repository
# url = "https://pypi.company.com/simple" # The base URL to your internal PyPI-compatible index
# priority = "primary"                    # Valid options: 'primary', 'supplemental', 'explicit'


## 5. BUILD SYSTEM #######################################################################

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"


## 6. TOOL-SPECIFIC CONFIGURATION ########################################################

### Code Quality ###########################################
[tool.black]
line-length = 100
target-version = ["py39"]

[tool.flake8]
extend-ignore = ["E203", "W503"]
max-line-length = 100

[tool.isort]
known_first_party = ["nmath"]
line_length = 100
profile = "black"
src_paths = ["source"]

[tool.mypy]
python_version = "3.9"
strict = true

check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_ignores = true


### Testing ################################################
[tool.pytest.ini_options]
addopts = "--strict-markers"
filterwarnings = [
    "error",
]
markers = [
    "integration_test: identifies tests that are part of the integration testing.",
]
testpaths = ["test"]

[tool.coverage.report]
omit = [
    "test/*", # Test file exclusion from coverage reporting
]

[tool.coverage.run]
branch = true
source = ["nmath"]
